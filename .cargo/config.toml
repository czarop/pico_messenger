[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]

linker = "flip-link"
rustflags = [
    "-C",
    "link-arg=--nmagic",
    "-C",
    "link-arg=-Tlink.x",
    "-C",
    "link-arg=-Tdefmt.x",
    "-C",
    "no-vectorize-loops",
]

runner = "probe-rs run --chip RP2040 --protocol swd"


[env]
DEFMT_LOG = "debug"
